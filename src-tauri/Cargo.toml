[package]
name = "rust-markdown"
version = "0.1.0"
description = "A Markdown text editor built with Tauri and React"
authors = ["you"]
edition = "2021"

[lib]
name = "rust_markdown_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
